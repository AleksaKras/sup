<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Демо: зум фото при скролі</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0d0d0d;
    color: #fff;
  }
  .intro {
    padding: 80px 24px 40px;
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
  }
  .intro h1 { font-size: 28px; margin-bottom: 12px; }
  .intro p { color: #aaa; line-height: 1.5; }

  .gallery {
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 24px 200px;
  }

  .photo-card {
    position: relative;
    height: 380px;
    border-radius: 18px;
    display: flex;
    align-items: flex-end;
    padding: 24px;
    opacity: 0;
    transform: scale(0.75);
    transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.9s ease;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    background-size: cover;
    background-position: center;
  }

  .photo-card.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* negative margin creates the overlap; each card sits slightly under the previous one */
  .photo-card:not(:first-child) {
    margin-top: -60px;
  }

  /* z-index climbs down the page so later cards are on top of earlier ones */
  .photo-card:nth-child(1) { z-index: 1; background: linear-gradient(160deg,#2b3a55,#1c2536); }
  .photo-card:nth-child(2) { z-index: 2; background: linear-gradient(160deg,#3a5a78,#22384a); }
  .photo-card:nth-child(3) { z-index: 3; background: linear-gradient(160deg,#4a7a5a,#25402c); }
  .photo-card:nth-child(4) { z-index: 4; background: linear-gradient(160deg,#c97a3c,#6b3d1a); }

  .card-label {
    background: rgba(0,0,0,0.55);
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 18px;
  }

  .spacer { height: 40vh; }
</style>
</head>
<body>

  <div class="intro">
    <h1>Приклад ефекту</h1>
    <p>Прогортуйте вниз. Кожне фото збільшується від 75% до 100%, коли з'являється у полі зору, і трохи "заходить" на попереднє — це і є накладення без візуального конфлікту.</p>
  </div>

  <div class="spacer"></div>

  <div class="gallery" id="gallery">
    <div class="photo-card"><span class="card-label">Захід сонця на SUP</span></div>
    <div class="photo-card"><span class="card-label">Тандем-дошка</span></div>
    <div class="photo-card"><span class="card-label">Реабілітаційна програма</span></div>
    <div class="photo-card"><span class="card-label">Гідропарк, локація</span></div>
  </div>

  <div class="spacer"></div>

<script>
  const cards = document.querySelectorAll('.photo-card');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.3 });

  cards.forEach(card => observer.observe(card));
</script>

</body>
</html>
